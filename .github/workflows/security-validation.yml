name: Security validation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  validate:
    name: Security validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate committed JSON
        run: python3 -c "import json,subprocess,pathlib; [json.loads(pathlib.Path(p).read_text()) for p in subprocess.check_output(['git','ls-files','*.json'],text=True).splitlines()]"
